name: macOS fork build
on:
  push:
    branches: [main]
    tags: ['efe-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-fork-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # build number = commit count
      - name: XCTest
        run: swift test
      - name: Check localization
        run: swift scripts/check-strings.swift
      - name: Build fork application (ad-hoc signed)
        run: bash scripts/build-fork.sh
        env:
          CLIPBOARDLINE_SIGN_IDENTITY: '-'
      - name: Verify signature and identity
        run: |
          codesign --verify --deep --strict build/ClipBoardLine.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ClipBoardLine.app/Contents/Info.plist)" = io.github.selcukozbilgi.clipboardline
          ! /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' build/ClipBoardLine.app/Contents/Info.plist 2>/dev/null
      - name: Package
        run: ditto -c -k --keepParent build/ClipBoardLine.app ClipBoardLine-macos-arm64.zip
      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipBoardLine-macos-arm64
          path: ClipBoardLine-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/efe-v')
    needs: test-and-fork-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ClipBoardLine-macos-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ClipBoardLine-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Kişisel fork build'i (ad-hoc imzalı, notarize edilmemiş)."
